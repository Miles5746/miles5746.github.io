  button {
    font: inherit;
    font-size: 16px;
    padding: 12px 22px;
    border: 2px solid #222;
    border-radius: 999px;
    background: #FFD60A;
    color: #222;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #222; outline-offset: 3px; }
  p { margin: 12px auto 0; max-width: 30em; font-size: 13px; color: #444; text-align: center; }
  p:not(:empty) { background: rgba(255,255,255,.9); padding: 8px 12px; border-radius: 8px; }
  p.warn { color: #b3261e; }
</style>
</head>
<body>
  <div>
    <button id="start">Start</button>
    <p id="msg"></p>
  </div>
<script>
  // Opening the launcher from a script is what lets it close its own tab later
  const msg = document.getElementById('msg');
  document.getElementById('start').addEventListener('click', () => {
    const launcher = window.open('launcher.html', '_blank');
    if (!launcher) {
      msg.textContent = 'The launcher was blocked. Allow popups for this site and try again.';
      msg.className = 'warn';
    } else {
      msg.textContent = '';
      msg.className = '';
    }
  });
</script>
</body>
</html>
