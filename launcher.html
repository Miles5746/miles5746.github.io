  .frame.on { visibility: visible; }

  const SIZE = 220;             // popup window size in px
  const OFFSET = 24;            // gap between cursor and window corner
  const button = document.getElementById('open');
  const msg = document.getElementById('msg');

  const song = document.getElementById('song');
  const popups = [];            // every popup opened, for starting/stopping the song
  let count = 0;
  const windows = [];           // { win, x, y } for each confirmed popup window
  let target = null;            // latest cursor position on screen
  let mode = 'open';            // what the button does next: 'open' or 'close'
  let closing = false;

  function setMode(m) {
    mode = m;
    button.textContent = m === 'open' ? 'Open' : 'Close';
  }

  function say(text, warn = false) {
    msg.textContent = text;
    msg.className = warn ? 'warn' : '';
  }

  // ---- Check 1: the launcher must not be in full screen ----
  function isFullScreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) return true;
    // Browser full screen (green button / F11): the window covers the whole screen,
    // including the area normally used by the menu bar or taskbar.
    return window.outerWidth >= screen.width && window.outerHeight >= screen.height;
  }

  function checkFullScreen() {
    if (mode !== 'open' || closing) return;
    if (isFullScreen()) {
      button.disabled = true;
      say('Exit full screen to open windows. In full screen, the browser opens them as tabs.', true);
    } else if (button.disabled) {
      button.disabled = false;
      say('');
    }
  }
  window.addEventListener('resize', checkFullScreen);
  document.addEventListener('fullscreenchange', checkFullScreen);
  document.addEventListener('webkitfullscreenchange', checkFullScreen);
  setInterval(checkFullScreen, 1000);
  checkFullScreen();

  // ---- Check 2: the popup must be a real window, not a tab ----
  function isTab(win) {
    // A tab shares the launcher's window frame: same size and position
    const sameFrame =
      Math.abs(win.outerWidth - window.outerWidth) < 4 &&
      Math.abs(win.outerHeight - window.outerHeight) < 4 &&
      Math.abs(win.screenX - window.screenX) < 4 &&
      Math.abs(win.screenY - window.screenY) < 4;
    // A popup window stays small; a tab is as big as the browser window
    const tooBig = win.innerWidth > SIZE * 2 || win.innerHeight > SIZE * 2;
    return sameFrame || tooBig;
  }

  function verifyPopup(win, entry, tries = 0) {
    if (win.closed) return;
    // Size can read as 0 until the window has finished opening
    if (win.outerWidth === 0 && tries < 10) {
      setTimeout(() => verifyPopup(win, entry, tries + 1), 100);
      return;
    }
    if (isTab(win)) {
      win.close();
      say('That opened as a tab, not a window, so it was closed. Check that your browser isn’t set to open popups in tabs.', true);
    } else {
      windows.push(entry);
      say('');
      setMode('close');
    }
  }

  // ---- Following the cursor ----
  const GLIDE_X = 320;           // how far windows drift right when the cursor is lost
  const GLIDE_Y = 220;           // ...and down
  const EDGE = 40;               // px from a page edge that counts as "about to leave"
  let lost = false;              // true while gliding away after losing the cursor
  let lastMove = 0;              // time of the last mousemove we saw
  let nearEdge = false;          // was that last mousemove close to a page edge?

  function track(e) {
    lost = false;
    lastMove = performance.now();
    target = { x: e.screenX + OFFSET, y: e.screenY + OFFSET };
    const v = e.view || window;
    nearEdge =
      e.clientX < EDGE || e.clientY < EDGE ||
      e.clientX > v.innerWidth - EDGE || e.clientY > v.innerHeight - EDGE;
  }

  function loseCursor() {
    if (lost || !target) return;
    lost = true;
    const maxX = (screen.availLeft || 0) + screen.availWidth - SIZE;
    const maxY = (screen.availTop || 0) + screen.availHeight - SIZE;
    target = {
      x: Math.min(target.x + GLIDE_X, maxX),
      y: Math.min(target.y + GLIDE_Y, maxY)
    };
  }

  // in which events they send when it moves onto the tab bar or title bar.
  function watchForLeaving(doc, win) {
    doc.addEventListener('mousemove', track);
    doc.addEventListener('mouseout', e => {
      if (!e.relatedTarget) setTimeout(() => {
        if (performance.now() - lastMove > 60) loseCursor();
      }, 80);
    });
    doc.documentElement.addEventListener('mouseleave', () => setTimeout(() => {
      if (performance.now() - lastMove > 60) loseCursor();
    }, 80));
    win.addEventListener('blur', () => setTimeout(() => {
      if (performance.now() - lastMove > 60) loseCursor();
    }, 80));

  watchForLeaving(document, window);

  setInterval(() => {
    if (!lost && nearEdge && target && performance.now() - lastMove > 150) loseCursor();
  }, 50);

  // Ease each window toward the cursor; later windows trail behind earlier ones
  function animate() {
    for (let i = windows.length - 1; i >= 0; i--) {
      if (windows[i].win.closed) windows.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      if (popups[i].closed) popups.splice(i, 1);
    }
    if (popups.length === 0 && mode === 'close' && !closing) {
      setMode('open');
    }
    if (popups.length === 0 && !song.paused) {
      song.pause();
      song.currentTime = 0;
    }
    if (target) {
      windows.forEach((w, i) => {
        const lead = i === 0 ? target : windows[i - 1];
        const ease = lost ? 0.04 : 0.25;   // slow, floaty glide when the cursor is lost
        w.x += (lead.x - w.x) * ease;
        w.y += (lead.y - w.y) * ease;
        try { w.win.moveTo(Math.round(w.x), Math.round(w.y)); } catch (e) {}
      });
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  // ---- Opening a window ----
  // Background animation: 3 frames, 200 ms each (from holymoly.gif)
  const frames = document.querySelectorAll('.frame');
  const FRAME_MS = 200;
  let playing = false;

  function showFrame(n) {
    frames.forEach((f, i) => f.classList.toggle('on', i === n));
  }

  button.addEventListener('click', () => {
    if (mode === 'close') { closeEverything(); return; }
    checkFullScreen();
    if (button.disabled || playing) return;
    playing = true;

    // Play from the first frame, hold on the last, then open the window
    showFrame(0);
    frames.forEach((_, i) => {
      if (i > 0) setTimeout(() => showFrame(i), i * FRAME_MS);
    });
    setTimeout(() => {
      playing = false;
      openWindow();
    }, frames.length * FRAME_MS);
  });

  // ---- Closing ----
  function closeEverything() {
    if (closing) return;
    closing = true;
    button.disabled = true;

    // Tell the windows to close: a storage signal, plus a direct close
    try { localStorage.setItem('tiny-window-close', String(Date.now())); } catch (e) {}
    popups.forEach(w => { try { w.close(); } catch (e) {} });
    song.pause();
    song.currentTime = 0;

    // Play the gif in reverse: last frame -> first frame
    const last = frames.length - 1;
    for (let k = 0; k <= last; k++) {
      setTimeout(() => showFrame(last - k), k * FRAME_MS);
    }

    // After the first frame has shown, wait 0.2 s, then close the launcher
    setTimeout(() => {
      window.close();
      // Browsers only let a page close itself in some cases
      setTimeout(() => {
        if (!window.closed) say('Done. You can close this tab now.');
      }, 300);
    }, frames.length * FRAME_MS + 200);
  }

  function openWindow() {

    const left = 100 + (count % 10) * 30;
    const top  = 100 + (count % 10) * 30;
    count++;

    // Unique name each time so every click makes a new window
    const win = window.open(
      'about:blank',
      'tiny' + Date.now(),
      `popup=yes,width=${SIZE},height=${SIZE},left=${left},top=${top}`
    );

    if (!win) {
      say('The popup was blocked. Allow popups for this page and try again.', true);
      return;
    }

    win.document.write(`<!DOCTYPE html>
<html><head><title> </title><style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: linear-gradient(to bottom right, #e0e0e0, #3a3a3a); }
  body { display: flex; align-items: center; justify-content: center; }
  .dot { width: 100vmin; height: 100vmin; display: block; object-fit: contain; }
</style></head>
<body><img class="dot" id="face" src="${FACES[0]}" alt="">
<script>
  const faces = ${JSON.stringify(FACES)};
  const BEAT = 60000 / 127;   // 127 bpm = about 0.472 s per beat
  const img = document.getElementById('face');
  const start = performance.now();
  let shown = 0;
  window.addEventListener('storage', e => {
    if (e.key === 'tiny-window-close') window.close();
  });
  // Time-based so the swaps never drift off the beat
  (function tick(now) {
    const i = Math.floor((now - start) / BEAT) % faces.length;
    if (i !== shown) { img.src = faces[i]; shown = i; }
    requestAnimationFrame(tick);
  })(start);
<\/script>
</body></html>`);
    win.document.close();

    popups.push(win);
    if (song.paused) {
      song.play().catch(() => say('The browser blocked the song. Click the button again to start it.', true));
    }

    // Keep tracking if the cursor passes over a popup
    watchForLeaving(win.document, win);

    setTimeout(() => verifyPopup(win, { win, x: left, y: top }), 150);
  }
</script>
</body>
</html>
