<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>&#8203;</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* A white screen that switches off like an old TV: squash to a line, then a dot */
  .screen {
    position: fixed; inset: 0;
    background: #fff;
    animation: tvOff 0.55s cubic-bezier(.7, 0, .3, 1) forwards;
  }
  @keyframes tvOff {
    0%   { transform: scale(1, 1);      opacity: 1; filter: brightness(1); }
    55%  { transform: scale(1, 0.004);  opacity: 1; filter: brightness(3); }
    85%  { transform: scale(0.02, 0.004); opacity: 1; }
    100% { transform: scale(0, 0);      opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen { animation: none; opacity: 0; }
  }
</style>
</head>
<body>
  <div class="screen"></div>
<script>
  // Try to close straight away; if the browser refuses, the switch-off plays
  // and the tab is left black.
  window.close();
</script>
</body>
</html>
